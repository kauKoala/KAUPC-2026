<article class="problem-statement" aria-labelledby="problem-title">
  <header class="problem-header">
    <p class="problem-eyebrow">KAUPC2026 TEST · F</p>
    <h1 id="problem-title">별 찍기 QA</h1>
    <dl class="problem-limits" aria-label="문제 제한">
      <div><dt>시간 제한</dt><dd>1초</dd></div>
      <div><dt>메모리 제한</dt><dd>512 MB</dd></div>
    </dl>
  </header>

  <section aria-labelledby="description-heading">
    <h2 id="description-heading">문제</h2>
    <p>첫째 줄부터 <code>N</code>번째 줄까지 차례대로 별을 출력하라. <code>i</code>번째 줄에는 별 <code>*</code>을 정확히 <code>i</code>개 출력한다.</p>
  </section>

  <section aria-labelledby="input-heading">
    <h2 id="input-heading">입력</h2>
    <p>첫째 줄에 정수 <code>N</code>이 주어진다.</p>
  </section>

  <section aria-labelledby="output-heading">
    <h2 id="output-heading">출력</h2>
    <p>첫째 줄부터 <code>N</code>번째 줄까지 별을 출력한다. 각 줄 끝에는 줄바꿈을 출력한다.</p>
  </section>

  <section aria-labelledby="limits-heading">
    <h2 id="limits-heading">제한</h2>
    <ul class="constraint-list">
      <li><code>1 ≤ N ≤ 100</code></li>
    </ul>
  </section>

  <section aria-labelledby="sample-heading">
    <h2 id="sample-heading">예제</h2>
    <div class="sample-card">
      <div class="sample-pane">
        <div class="sample-label">예제 입력 1</div>
        <pre data-sample-input>3</pre>
      </div>
      <div class="sample-pane">
        <div class="sample-label">예제 출력 1</div>
        <pre data-sample-output>*
**
***</pre>
      </div>
    </div>
  </section>
</article>
