# Generated from 'nginx-conf.in' on Fri Aug 28 23:00:13 UTC 2026.

# nginx configuration for DOMjudge

### upstream ###
#
# always include this and make sure it points to the socket of PHP-FPM
upstream domjudge {
	server unix:/var/run/php-fpm-domjudge.sock;
	#server unix:/var/run/php-fpm-domjudge.sock;
}

# Read the HTTPS field from the X-Forwarded-Proto field from any upstream proxy
# Fall back to the internal $https variable if not set
map $http_x_forwarded_proto $fastcgi_param_https_variable {
	default $https;
	https 'on';
}

# 로그인 화면을 열려는 요청인지. ?account=1이 붙으면 원래 로그인 화면을 보인다.
map "$request_method:$uri:$arg_account" $kaupc_guest_entry {
	default 0;
	"GET:/login:" 1;
}

### http host config ###
#

server {
	listen 80;
	listen [::]:80;

	# If you are reading from the event feed, make sure this is large enough.
	# If you have a slow event feed reader, nginx needs to keep the connection
	# open long enough between two write operations
	send_timeout 36000s;
	# custom/js, custom/css는 저장소에서 바로 고치는 파일이다. DOMjudge가 ?v=<버전>을
	# 붙여 캐시하므로 수정해도 브라우저가 옛 파일을 쓴다. 이 경로만 캐시를 끈다.
	location ~ ^/(js|css)/custom/ {
		root /opt/domjudge/domserver/webapp/public;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		try_files $uri =404;
	}

	# 문제 에디터를 같은 주소 아래에 붙인다. 별도 포트도, SSH 터널도 필요 없다.
	# DOMjudge 세션으로 운영자인지 먼저 확인하고, 통과한 요청만 에디터로 넘긴다.
	# /api/v4/user는 참가자 로그인에도 200을 준다. 사용자 목록은 운영자만 볼 수 있어 이것으로 확인한다.
	location = /_authcheck {
		internal;
		proxy_pass http://127.0.0.1/api/v4/users?ids%5B%5D=admin;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header X-Original-URI $request_uri;
	}

	location /authoring/ {
		auth_request /_authcheck;
		error_page 401 403 = @authoring_login;
		proxy_pass http://problem-editor:8088/;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Prefix /authoring;
		proxy_read_timeout 900s;
		client_max_body_size 0;
	}

	location @authoring_login {
		return 302 /login;
	}

	location = /authoring {
		return 301 /authoring/;
	}

	# 참가자가 처음 로그인할 때 스코어보드 이름을 정한다. 에디터 중 이 경로만 참가자에게 열린다.
	# 어느 팀인지는 에디터가 이 요청의 DOMjudge 세션으로 직접 확인한다.
	location = /participant/nickname {
		proxy_pass http://problem-editor:8088/participant/nickname;
		proxy_set_header Host $host;
		client_max_body_size 4k;
	}

	# 공개 대회에는 로그인 화면이 없다. 로그인 화면을 여는 요청(GET /login)은 DOMjudge 대신 에디터가 받아,
	# 게스트 계정으로 대신 로그인시키고 곧바로 대회 화면으로 보낸다. 로그인 안 한 방문자를 DOMjudge가 /login으로
	# 보내므로, 어느 주소로 들어오든 로그인 화면을 보지 않는다. 폼 제출(POST /login)은 그대로 DOMjudge로 간다.
	# 운영진과 KAUPC 계정은 /login?account=1 에서 원래 로그인 화면을 쓴다.
	if ($kaupc_guest_entry) {
		rewrite ^ /participant/enter last;
	}

	# DOMjudge 공개 화면 대신 공개 대회가 보이는 대회 목록으로 간다. 로그인 안 했으면 위의 게스트 입장을 거친다.
	# 첫 화면(/)은 DOMjudge가 권한에 따라 나눈다. 로그인 안 한 방문자는 /public으로, 운영자는 운영자 화면으로 간다.
	if ($uri = "/public") {
		return 302 /team;
	}

	# 채점 현황 탭이 부르는 모든 제출 목록. 공개 대회의 것만 돌려준다.
	location = /participant/submissions {
		proxy_pass http://problem-editor:8088/participant/submissions;
		proxy_set_header Host $host;
	}

	# 채점 현황에서 펼친 제출의 코드와 테스트별 결과.
	location ^~ /participant/submissions/ {
		proxy_pass http://problem-editor:8088;
		proxy_set_header Host $host;
	}

	location = /participant/enter {
		internal;
		proxy_pass http://problem-editor:8088/participant/enter;
		proxy_set_header Host $host;
		# 에디터가 접속자별로 만드는 게스트 수를 제한하므로 접속한 주소를 넘긴다.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 30s;
	}

	include /etc/nginx/snippets/domjudge-inner;
}

